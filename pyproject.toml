[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Without this, setuptools tries to auto-discover packages and trips over the sibling
# data/, models/, runs/ and results/ directories. The glob is what puts the subpackages
# in the wheel; naming only "mol_optim" installs the top level and silently drops them.
[tool.setuptools.packages.find]
include = ["mol_optim*"]

[project]
name = "mol-optim"
version = "0.1.0"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["rdkit", "torch", "numpy", "matplotlib"]

[project.scripts]
mol-optim = "mol_optim.cli:main"

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: needs a training run; excluded from the per-commit suite"]
filterwarnings = ["error::UserWarning"]
