name: quality control

on:
  push:
    paths-ignore: ["**/*.md", "results/**", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "results/**", "docs/**"]
  workflow_dispatch:

# A second push to the same branch cancels the first: no minutes spent finishing a run
# whose answer is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Before the editable install, so the CPU build is what satisfies torch and pip
      # never reaches for the CUDA one.
      - name: Install torch, CPU only
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install
        run: pip install -e ".[dev]"

      # -rs so a green run says which tests were skipped for want of a dataset, rather
      # than only how many passed.
      - name: Run the suite
        run: pytest -m "not slow" -q -rs
