name: quality control
on:
  pull_request:
    paths-ignore: ["**/*.md", "results/**", "docs/**"]
  workflow_dispatch:

# A second push to the same branch cancels the first: no minutes spent finishing a run
# whose answer is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch, CPU only
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run the suite
        run: pytest -m "not slow" -q -rs
